<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bot Manager</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    input, button { font-family: monospace; font-size: 14px; padding: 6px; margin: 2px; }
    button { cursor: pointer; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    td, th { border: 1px solid #444; padding: 8px; text-align: left; vertical-align: top; }
    .running { color: #4f4; }
    .stopped { color: #f44; }
    #newBot { margin-bottom: 20px; }
    .step { padding: 2px 6px; margin: 2px 0; border-radius: 3px; font-size: 12px; }
    .not_started { color: #888; }
    .in_progress { color: #fc4; background: #332a00; }
    .done { color: #4f4; }
    .failed { color: #f44; background: #330000; }
    .viewer-frame { width: 480px; height: 320px; border: 1px solid #444; display: none; }
    .viewer-frame.open { display: block; }
  </style>
</head>
<body>
  <h2>Bot Manager</h2>

  <div id="newBot">
    <input id="newName" placeholder="bot name">
    <button onclick="createBot()">Create + Start</button>
  </div>

  <table id="botTable">
    <thead>
      <tr><th>Name</th><th>PID</th><th>Status</th><th>Actions</th><th>Command</th><th>Job</th><th>View</th></tr>
    </thead>
    <tbody id="botRows"></tbody>
  </table>

<script>
async function api(url, options) {
  const res = await fetch(url, options)
  return res.json()
}

// row elements are kept across refreshes so the viewer iframe never reloads.
// only the dynamic cells (status/pid/job) get their content replaced.
const rows = {} // name -> { tr, statusCell, pidCell, jobCell, viewerFrame, viewBtn }

function buildRow(bot) {
  const tr = document.createElement('tr')

  const nameCell = document.createElement('td')
  nameCell.textContent = bot.name

  const pidCell = document.createElement('td')

  const statusCell = document.createElement('td')

  const actionsCell = document.createElement('td')
  const stopBtn = document.createElement('button')
  stopBtn.textContent = 'Stop'
  stopBtn.onclick = () => stopBot(bot.name)
  const restartBtn = document.createElement('button')
  restartBtn.textContent = 'Restart'
  restartBtn.onclick = () => restartBot(bot.name)
  actionsCell.append(stopBtn, restartBtn)

  const cmdCell = document.createElement('td')
  const cmdInput = document.createElement('input')
  cmdInput.placeholder = '@chop 10;@sell'
  cmdInput.size = 25
  const sendBtn = document.createElement('button')
  sendBtn.textContent = 'Send'
  sendBtn.onclick = () => sendCommand(bot.name, cmdInput)
  cmdCell.append(cmdInput, sendBtn)

  const jobCell = document.createElement('td')

  const viewCell = document.createElement('td')
  const viewBtn = document.createElement('button')
  viewBtn.textContent = 'Show view'
  const viewerFrame = document.createElement('iframe')
  viewerFrame.className = 'viewer-frame'

  viewBtn.onclick = () => {
    const isOpen = viewerFrame.classList.toggle('open')
    if (isOpen) {
      viewerFrame.src = `http://localhost:${bot.viewerPort}`
      viewBtn.textContent = 'Hide view'
    } else {
      viewerFrame.src = '' // stop rendering while hidden
      viewBtn.textContent = 'Show view'
    }
  }

  viewCell.append(viewBtn, viewerFrame)

  tr.append(nameCell, pidCell, statusCell, actionsCell, cmdCell, jobCell, viewCell)

  rows[bot.name] = { tr, statusCell, pidCell, jobCell, viewerFrame, viewBtn }
  document.getElementById('botRows').appendChild(tr)
}

function updateRow(bot) {
  const row = rows[bot.name]
  row.pidCell.textContent = bot.pid
  row.statusCell.textContent = bot.status
  row.statusCell.className = bot.status

  row.jobCell.innerHTML = bot.job
    ? bot.job.steps.map(s => {
        const progress = s.progress ? ` (${s.progress.current}/${s.progress.total})` : ''
        const error = s.error ? ` - ${s.error}` : ''
        return `<div class="step ${s.status}">${s.cmd}${progress} — ${s.status}${error}</div>`
      }).join('')
    : '<span style="color:#666">no job yet</span>'
}

async function refresh() {
  const bots = await api('/bots')

  bots.forEach(bot => {
    if (!rows[bot.name]) buildRow(bot)
    updateRow(bot)
  })
}

async function createBot() {
  const name = document.getElementById('newName').value.trim()
  if (!name) return
  await api(`/bots/${name}/start`, { method: 'POST' })
  document.getElementById('newName').value = ''
  refresh()
}

async function stopBot(name) {
  await api(`/bots/${name}/stop`, { method: 'POST' })
  refresh()
}

async function restartBot(name) {
  await api(`/bots/${name}/restart`, { method: 'POST' })
  refresh()
}

async function sendCommand(name, input) {
  const cmd = input.value.trim()
  if (!cmd) return
  await api(`/bots/${name}/command`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cmd })
  })
  input.value = ''
}

refresh()
setInterval(refresh, 3000)
</script>
</body>
</html>
